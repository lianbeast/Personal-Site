<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Personal Site — Logo Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0a0a0a;
        --gold: #d4af37;
        --beige: #f5f0e6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #main {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--bg);
        overflow: hidden;
      }
      .scene {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 80px;
      }
      .logo-wrap {
        position: relative;
        width: 420px;
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          rgba(212, 175, 55, 0.3) 0%,
          rgba(10, 10, 10, 0) 65%
        );
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      .logo-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #ring {
        stroke: var(--gold);
      }
      #dot {
        fill: var(--gold);
      }
      #tagline {
        font-family: "Playfair Display", serif;
        font-size: 50px;
        font-weight: 400;
        color: var(--beige);
        opacity: 0;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div class="scene">
        <div class="logo-wrap">
          <div class="logo-glow"></div>
          <svg
            class="logo-svg"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 100 100"
          >
            <circle
              id="ring"
              cx="50"
              cy="50"
              r="42"
              fill="none"
              stroke-width="3"
              stroke-dasharray="264"
              stroke-dashoffset="264"
            />
            <circle id="dot" cx="50" cy="50" r="4" opacity="0" />
          </svg>
        </div>
        <div class="tagline-wrap">
          <h2 id="tagline" class="clip" data-start="2.5" data-duration="1.5" data-track-index="1">
            I build things that live on the web
          </h2>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const ring = document.getElementById("ring");
        const dot = document.getElementById("dot");
        const tagline = document.getElementById("tagline");
        const logoGlow = document.querySelector(".logo-glow");

        // Ring draws itself in over 2.5s via stroke-dashoffset.
        // A proxy object carries the value; onUpdate writes the attribute
        // so the tween is seek-safe under the HyperFrames render host.
        const ringProxy = { offset: 264 };
        tl.to(
          ringProxy,
          {
            offset: 0,
            duration: 2.5,
            ease: "power2.out",
            onUpdate: function () {
              ring.setAttribute("stroke-dashoffset", ringProxy.offset);
            },
          },
          0
        );

        // Subtle gold glow blooms as the ring completes its draw.
        tl.fromTo(
          logoGlow,
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power2.out" },
          2.0
        );
        tl.to(logoGlow, { opacity: 0, duration: 1.4, ease: "power2.out" }, 2.6);

        // Center dot appears as the ring closes around it.
        tl.fromTo(
          dot,
          { opacity: 0 },
          { opacity: 1, duration: 0.25, ease: "power2.out" },
          2.3
        );

        // Tagline sweeps in from the right (x: 40 -> 0) over 0.5s.
        tl.fromTo(
          tagline,
          { x: 40, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          2.5
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
