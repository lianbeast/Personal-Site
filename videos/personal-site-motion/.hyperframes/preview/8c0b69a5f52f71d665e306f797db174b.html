    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0A0A;
      }
      #stage {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #0A0A0A;
      }
      /* ── Logo: centered hero mark ── */
      #logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 320px;
        height: 320px;
        transform: translate(-50%, -50%);
        opacity: 0;
      }
      #logo.active { opacity: 1; }
      #logo svg { width: 100%; height: 100%; display: block; }
      /* Ring path: draw-on via stroke-dashoffset */
      .ring-path {
        fill: none;
        stroke: #D4AF37;
        stroke-width: 3;
        stroke-dasharray: 75.398;
        stroke-dashoffset: 75.398;
      }
      /* Center dot — initial state set via GSAP, not CSS transform */
      .dot {
        fill: #D4AF37;
        transform-box: fill-box;
        transform-origin: center;
      }
      /* ── Glow bloom on the logo ── */
      #logo-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 320px;
        height: 320px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212,175,55,0.35) 0%, rgba(212,175,55,0.1) 30%, transparent 60%);
        opacity: 0;
        pointer-events: none;
      }
      /* ── Tagline: sweeps in from the right beneath the mark ── */
      #tagline {
        position: absolute;
        top: calc(50% + 220px);
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 48px;
        font-weight: 500;
        color: #F5F0E6;
        letter-spacing: -0.02em;
        line-height: 1.2;
        opacity: 0;
      }
      #tagline.active {
        opacity: 1;
        transform: translateX(0);
      }
      /* ── Underline sweep ── */
      #underline {
        display: block;
        margin: 8px auto 0;
        width: 0;
        height: 2px;
        background: #D4AF37;
        transform-origin: left center;
        transform-box: fill-box;
      }
      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        .ring-path { stroke-dashoffset: 0; }
        .dot { transform: scale(1); }
        #tagline.active { transform: translateX(0); }
        #logo-glow { opacity: 0; }
      }
