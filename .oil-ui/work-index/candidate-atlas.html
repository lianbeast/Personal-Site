<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Index — Atlas direction</title>
<style>
/* ── Atlas (as a static proof-page, non-interactive). ── */
@font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:400; src:url(assets/fonts/jb-mono-400.woff2) format('woff2'); }
@font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:500; src:url(assets/fonts/jb-mono-500.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-style:normal; font-weight:400; src:url(assets/fonts/inter-400.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-style:normal; font-weight:600; src:url(assets/fonts/inter-600.woff2) format('woff2'); }
@font-face { font-family:'Playfair Display'; font-style:normal; font-weight:600; src:url(assets/fonts/playfair-600.woff2) format('woff2'); }
:root{--bg:#0A0A0A;--panel:#101012;--hairline:rgba(255,255,255,.07);--hairline-strong:rgba(255,255,255,.16);--text:#E4E4E7;--muted:#9D9DA6;--faint:#7E7E86;--gold:#D4AF37;--gold-dim:rgba(212,175,55,.16);--sel:rgba(212,175,55,.06);--sel-line:rgba(212,175,55,.38);--lang-ts:#3178c6;--lang-js:#b58f2e;--lang-py:#3572a5;--lang-html:#a8442d;--gutter:22px}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.55 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input{font:inherit}.mono{font-family:'JetBrains Mono',monospace}@media (prefers-reduced-motion:no-preference){header{animation:fade-down 500ms cubic-bezier(.16,1,.3,1) both}.console{animation:rise 600ms cubic-bezier(.16,1,.3,1) 120ms both}}@keyframes fade-down{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1}}header{display:flex;align-items:center;gap:18px;height:58px;padding:0 var(--gutter);border-bottom:1px solid var(--hairline-strong);background:var(--bg)}header .mark{display:flex;align-items:center;gap:10px}.mark svg{color:var(--gold);display:block}.mark b{font:600 13px/1 'Inter';letter-spacing:.22em;text-transform:uppercase;color:var(--text)}header .search{flex:1 1 auto;max-width:420px;display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;border:1px solid var(--hairline);border-radius:6px;background:var(--panel);transition:border-color 180ms ease}.header .search:focus-within{border-color:var(--sel-line)}header .search .glyph{color:var(--faint);font-size:13px}.search input{flex:1;min-width:0;background:none;border:0;outline:none;font:400 13px/1 'JetBrains Mono';letter-spacing:.015em;color:var(--text)}.search input::placeholder{color:var(--faint)}header .spacer{flex:1}.coords{color:var(--faint);font:400 10.5px/1 'JetBrows Mono';letter-spacing:.08em;white-space:nowrap}.back{color:var(--muted);font:500 12px/1 'Inter';text-decoration:none;padding:9px 13px;border:1px solid var(--hairline);border-radius:6px;transition:border-color 180ms ease,color 180ms ease,background 180ms ease;white-space:nowrap}.back:hover{color:var(--gold);border-color:var(--sel-line);background:var(--sel)}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}@media (max-width:1120px){.console{grid-template-columns:196px minmax(0,1fr)}footer.dossier{position:fixed;top:58px;right:0;bottom:0;width:min(380px,92vw);transform:translateX(101%);transition:transform 320ms cubic-bezier(.32,.72,0,1);border-left:1px solid var(--hairline-strong);z-index:30;background:var(--bg);box-shadow:-24px 0 60px rgba(0,0,0,.55)}footer.dossier.open{transform:none}.layers{border-right:0;border-bottom:1px solid var(--hairline);flex-direction:row;gap:6px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;align-items:center}.layers>h2,.layers .foot{display:none}.layer{width:auto;padding:7px 11px;border:1px solid var(--hairline);border-radius:999px;white-space:nowrap}.layer:hover{background:none}.layer[aria-pressed="true"]{border-color:var(--gold)}}@media (max-width:760px){.console{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.layers{border-right:0;border-bottom:1px solid var(--hairline);flex-direction:row;gap:6px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;align-items:center}.layers>h2,.layers .foot{display:none}.layer{width:auto;padding:7px 11px;border:1px solid var(--hairline);border-radius:999px;white-space:nowrap}.layer:hover{background:none}.layer[aria-pressed="true"]{border-color:var(--gold)}.grid{grid-template-columns:1fr 1fr;gap:10px;padding:12px}.header .coords{display:none}.header{gap:10px}.search{max-width:none}}.@media (max-width:470px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
<div x-data={atlas()}>
<header>
  <span class="mark" aria-hidden="true"><svg width="15" height="15" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.7"><path d="M0 -6.4V6.4M-6.4 0H6.4"/><circle r="2" fill="currentColor" stroke="none"/></g></svg></span>
  <b>Work&nbsp;Index</b><label class="search" for="q"><span class="glyph mono">⌕</span><input id="q" type="search" placeholder="search plots" x-model="q" autocomplete="off" spellcheck="false"></label><span class="spacer"></span><span class="coords mono"><span x-text="shown.length"></span>&thinsp;/&thinsp;<span x-text="WORK.length"></span> plots · <span x-text="liveCount()"></span> live</span><a class="back" href="#">← Home</a>
</header>
<div class="console">
  <aside class="layers" aria-label="Layers"><h2 class="mono">Layers</h2><button class="layer" @click="cat='all'" :aria-pressed="cat==='all'"><span class="name">All plots</span><span class="n" x-text="WORK.length"></span></button><template x-for="c in CATS" :key="c"><button class="layer" @click="cat=c" :aria-pressed="cat===c"><span class="name" x-text="c"></span><span class="n" x-text="WORK.filter(function(w){return w.cat===c}).length"></span></button></template><div class="foot mono">LAT <em>39.15°</em> N · LNG <em>84.50°</em> W · EPOCH <em>2022.09 — 2026.10</em> · SOURCE <em>github.com/lianbeast</em></div></aside>
<main class="plot" aria-label="Index grid">
  <div class="strip mono">SCALE <b>1:1</b><span x-show="q">QUERY <b class="query" x-text="'&quot;' + q + '&quot;'"></b></span><span x-show="cat !== 'all'">LAYER <b x-text="cat"></b></span></div>
  <div class="grid">
    <template x-for="w in shown" :key="w.slug"><button class="card" :aria-pressed="sel===w.slug" @click="select(w)" @mouseenter="hover=w.slug" @mouseleave="hover===w.slug && (hover=null)"><span class="thumb"><template x-if="w.jpg"><img class="still" :src="w.jpg" :alt="w.name + ' — site preview'" :loading="w.slug==='personal-site'?'eager':'lazy'" decoding="async"></template><template x-if="w.mp4"><video class="clip" :src="w.mp4" muted loop playsinline preload="none" aria-hidden="true"><script>onmouseenter=>{const on=sel===w.slug||hover===w.slug;if(on){$el.play().catch(()=>{})}else{$el.pause();$el.currentTime=0}})</script></template><template x-if="!w.jpg"><span class="ph" aria-hidden="true"><svg width="26" height="26" viewBox="-8 -8 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 -5.4V5.4M-5.4 0H5.4"/><circle r="1.8" fill="currentColor" stroke="none"/></g></svg></span></template></span><span class="body"><span class="name" x-text="w.name"></span><span class="blurb" x-text="w.blurb"></span></span><span class="meta"><template x-if="w.lang"><span class="dot" :style="'background:'+langColor(w.lang)"></span></template><span class="lang" x-text="w.lang||'—'"></span><span class="badge" :class="badgeCls(w)" x-text="badgeTxt(w)"></span></span></button></template><p class="none mono" x-show="!shown.length" x-text="'no plot matches ' + (q ? '&quot;' + q + '&quot;' : 'this survey') + '.'."></p></div></main>
<aside class="dossier" :class="{ 'has-sel': !!selected, 'open': !!sel }" aria-label="Dossier"><div class="empty" x-show="!selected"><svg width="34" height="34" viewBox="-8 -8 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.1"><path d="M0 -6.2V6.2M-6.2 0H6.2"/></g><circle r="2" fill="currentColor"/></svg><p>Survey the index.<br>Select a plot to open its dossier.</p></div><template x-if="selected"><div class="content" :key="sel"><div class="clip"><template x-if="selected.jpg"><img class="still" :src="selected.jpg" :alt="selected.name + ' — site preview'" :loading="sel==='personal-site' ? 'eager' : 'lazy'" decoding="async"></template><template x-if="selected.mp4"><video class="dplay" :src="selected.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video></template><template x-if="!selected.jpg"><span class="nothumb">no imagery on file</span></template></div><div class="topline mono"><span>FILE <span x-text="selected.no"></span></span><span x-text="selected.coords"></span></div><div class="cat mono" x-text="selected.cat"></div><h3 x-text="selected.name"></h3><p class="blurb" x-text="selected.blurb"></p><table><tbody><tr><td class="k">Stack</td><td class="v" x-text="selected.stack"></td></tr><tr><td class="k">Language</td><td class="v" x-text="selected.lang||'—'"></td></tr><tr><td class="k">Last push</td><td class="v" x-text="selected.push"></td></tr><tr><td class="k">Status</td><td class="v" x-text="statusTxt(selected)"></td></tr></tbody></table><div class="actions"><template x-if="selected.live"><a class="btn solid" :href="selected.live" target="_blank" rel="noopener noreferrer">Open site&nbsp;<small>↗</small></a></template><template x-if="!selected.live"><span class="btn" style="pointer-events:none;opacity:.55">Open site&nbsp;<small>↗</small></span></template><template x-if="selected.repo"><a class="btn" :href="selected.repo" target="_blank" rel="noopener noreferrer">Repository</a></template></div><div class="status" x-show="selected.note"><b>Survey note</b><span x-text="selected.note"></span></div></template></aside>
</div>
