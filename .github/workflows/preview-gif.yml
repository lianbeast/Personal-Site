name: Update Live Preview GIF

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: write
  actions: write # gh workflow run (workflow_dispatch) needs the actions scope

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Record preview GIF
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run record:preview

      - name: Record project previews (mp4 + poster)
        run: npm run record:previews

      - name: Commit recorded previews (if changed)
        run: |
          if git diff --quiet preview.gif public/previews; then
            echo "previews unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add preview.gif public/previews
            # [skip ci] + deploy paths-ignore break the regenerate loop
            git commit -m "[skip ci] Update recorded previews"
            git push
            # [skip ci] also blocks the push-triggered deploy that would
            # actually ship these new preview assets to Pages, so trigger
            # it explicitly. The loop still breaks: this deploy re-runs
            # the recorder, which finds previews unchanged and commits
            # nothing, so it never fires another deploy.
            gh workflow run deploy.yml --ref main
          fi
