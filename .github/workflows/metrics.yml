name: GitHub Metrics

on:
  # Regenerate the profile README's metrics section daily.
  schedule:
    - cron: "0 0 * * *"
  # Manual re-render from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lianbeast
          repo: lowlighter/metrics
          template: markdown
          markdown: .github/metrics.markdown.md
          filename: README.md
          markdown_cache: .github/.metrics-cache
          config_timezone: "UTC"
          plugin_isocalendar: "1"
          plugin_languages: "1"
          plugin_lines: "1"
          plugin_skyline: "1"
          committer_message: "[skip ci] Update GitHub metrics"