name: GitHub Metrics

on:
  # Regenerate the profile README's metrics section daily.
  schedule:
    - cron: "0 0 * * *"
  # Manual re-render from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lianbeast
          template: markdown
          # NOTE: do NOT set `repo` here. The markdown template's embed()
          # function inherits the outer query (including `repo`) and forces
          # the classic template for each embed; the classic template only
          # supports user/organization scope, so a `repo` value makes every
          # embed fail with "template not supported for: repository".
          # Metrics are therefore rendered for your user account, which is
          # the standard profile README behaviour.
          # The markdown template is fetched by URL (the action runs in a
          # Docker container and reads the template from this address, not
          # from the checked-out repo).
          markdown: https://raw.githubusercontent.com/lianbeast/Personal-Site/main/.github/metrics.markdown.md
          filename: README.md
          markdown_cache: .cache
          config_timezone: "UTC"
          plugin_isocalendar: "1"
          plugin_languages: "1"
          plugin_lines: "1"
          plugin_skyline: "1"
          committer_message: "[skip ci] Update GitHub metrics"