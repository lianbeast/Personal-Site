name: GitHub Metrics

on:
  # Regenerate the profile README's metrics section daily.
  schedule:
    - cron: "0 0 * * *"
  # Manual re-render from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a bad render can be rolled back to the last
          # committed README rather than leaving an error message in place.
          fetch-depth: 0

      # Render to a staging file, never to README.md directly. The metrics
      # action writes its output file even when it fails — a failed run writes
      # a GitHub API error string instead of the real README. That is how this
      # repo's README once contained the literal text:
      #   "You did not provide a valid 'markdown' query parameter..."
      # Writing to README.md.tmp means a bad render can never touch the
      # committed file; the publish step validates before moving it.
      - name: Render metrics (staging)
        id: render
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lianbeast
          template: markdown
          # NOTE: do NOT set `repo` here. The markdown template's embed()
          # function inherits the outer query (including `repo`) and forces
          # the classic template for each embed; the classic template only
          # supports user/organization scope, so a `repo` value makes every
          # embed fail with "template not supported for: repository".
          # Metrics are therefore rendered for your user account, which is
          # the standard profile README behaviour.
          # The markdown template is fetched by URL (the action runs in a
          # Docker container and reads the template from this address, not
          # from the checked-out repo).
          markdown: https://raw.githubusercontent.com/lianbeast/Personal-Site/main/.github/metrics.markdown.md
          filename: README.md.tmp
          markdown_cache: .cache
          config_timezone: "UTC"
          plugin_isocalendar: "1"
          plugin_languages: "1"
          plugin_lines: "1"
          plugin_skyline: "1"

      # The action commits internally when a committer token is configured.
      # We do not give it one, so it only writes the staging file and this
      # step owns the commit — with validation first.
      - name: Validate and publish
        if: always()
        run: |
          set -e
          if [ -f README.md.tmp ] && grep -q "Personal-Site" README.md.tmp && ! grep -qi "did not provide a valid" README.md.tmp; then
            mv README.md.tmp README.md
          else
            echo "Metrics render failed or produced invalid output — leaving the committed README untouched."
            rm -f README.md.tmp
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[skip ci] Update GitHub metrics" || echo "Nothing to commit"
          git push