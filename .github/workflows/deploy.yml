name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # preview-gif.yml commits its recordings with [skip ci] so the re-record
  # deploy loop terminates. Every push here deploys: a previews-only commit
  # still needs to ship, and paths-ignore cannot tell it apart from a code push
  # (it suppresses the whole run if *any* pushed file matches, so it also ate
  # the previews).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
