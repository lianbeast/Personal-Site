name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # GIF-only commits don't need a redeploy
    paths-ignore: ['preview.gif']
  # preview-gif.yml commits its recordings with [skip ci] (required — the encoder
  # isn't byte-reproducible, so an unguarded loop would re-record and redeploy
  # forever). That leaves new previews on main but not on Pages, so ship them
  # by dispatching this workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
